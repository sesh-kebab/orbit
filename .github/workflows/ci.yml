name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # A full install, deliberately. `--omit=optional` looks tempting — it
      # would skip @github/copilot's ~326 MB platform runtime, which Orbit does
      # not bundle — but optional dependencies are also how rollup and esbuild
      # ship their native binaries, and dropping those breaks the build
      # outright. npm has no way to omit one package's optionals, and the cache
      # makes the download cheap after the first run.
      - name: Install dependencies
        run: npm ci

      # `npm run build` is typecheck (all three tsconfigs) then electron-vite.
      - name: Build
        run: npm run build
