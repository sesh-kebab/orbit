name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # --omit=optional skips @github/copilot's eight platform runtimes, which
      # are ~326 MB each. Orbit does not bundle the runtime (see
      # src/main/runtime.ts), and nothing in the typecheck or the bundle needs
      # the binary, so installing it would only buy a slower build.
      - name: Install dependencies
        run: npm ci --omit=optional

      # `npm run build` is typecheck (all three tsconfigs) then electron-vite.
      - name: Build
        run: npm run build
