name: Release

on:
  push:
    tags: ["v*"]
  # So a release can be rehearsed without leaving a tag behind.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the installers but do not upload them
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # Cheap and first: a mismatched version is the usual way a release goes out
  # mislabelled, and finding out after three platforms have built is a waste.
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tag must match package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match package.json version $pkg."
            echo "Bump package.json and re-tag, so the release is not mislabelled."
            exit 1
          fi
          echo "Releasing v$pkg"

  build:
    name: ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not throw away the other two, which take
      # just as long to rebuild.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            args: --mac
          - os: windows-latest
            name: Windows
            args: --win
          - os: ubuntu-latest
            name: Linux
            args: --linux

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Full install: see ci.yml. Optional dependencies carry rollup's and
      # esbuild's native binaries, so they cannot be skipped.
      - name: Install dependencies
        run: npm ci

      # electron-builder packages whatever is in out/; it does not build it.
      # Without this the asar ships empty and the app has no entry point.
      - name: Build
        run: npm run build

      - name: Package
        env:
          # electron-builder uploads to the draft release itself when a tag
          # triggered the run; on a manual run it only builds.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          npx electron-builder ${{ matrix.args }}
          --publish ${{ (startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run) && 'always' || 'never' }}

      # Kept regardless of whether anything was published, so a dry run still
      # produces something to download and try.
      - name: Upload installers
        uses: actions/upload-artifact@v5
        with:
          name: orbit-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 14

  notes:
    name: Write release notes
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The two things every first-time user hits are the Copilot CLI
      # prerequisite and Gatekeeper. Neither belongs in a commit log, so they
      # are prepended to the generated notes rather than left to chance.
      - name: Prepend the preamble to the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME}"
          {
            echo "## Before you start"
            echo
            echo "Orbit does not bundle the Copilot runtime — it drives the CLI you already have, and reads your login from \`~/.copilot\`. So install and sign in first:"
            echo
            echo '```'
            echo "npm i -g @github/copilot   # or: brew install copilot-cli"
            echo "copilot                    # then /login"
            echo '```'
            echo
            echo "## macOS: these builds are unsigned"
            echo
            echo "Orbit is not yet signed with an Apple Developer certificate, so Gatekeeper will refuse to open it on a double-click. Right-click the app and choose **Open**, or clear the quarantine flag:"
            echo
            echo '```'
            echo "xattr -dr com.apple.quarantine /Applications/Orbit.app"
            echo '```'
            echo
            echo "## Windows and Linux"
            echo
            echo "These builds are produced by CI but are not yet manually tested — the tray icon and file-open behaviour in particular. Please report anything odd."
            echo
            echo "---"
            echo
          } > preamble.md

          gh release view "$version" --json body --jq .body > generated.md || echo "" > generated.md
          cat preamble.md generated.md > body.md
          gh release edit "$version" --notes-file body.md
